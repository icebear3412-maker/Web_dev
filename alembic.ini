[alembic]
# Migration scripts live in backend/migrations, relative to this file.
script_location = %(here)s/migrations
# Let Alembic import modules from the backend directory when it runs.
prepend_sys_path = .
# Fallback connection address. migrations/env.py replaces this with DATABASE_URL
# from .env, so local development and Docker each use their own database.
sqlalchemy.url = postgresql+psycopg2://postgres:postgres@localhost:5432/cinema_db

[loggers]
# Configure console output for Alembic migration commands.
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
# Show which migration revisions Alembic applies or rolls back.
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
